Gemini-2.5-Pro:
    model_path: "gemini-2.5-pro"  # 安定版Proモデル (1M tokens入力, 64K tokens出力)
    model_type: "gemini"
    temperature: 0

Gemini-2.0-Flash:
    model_path: "gemini-2.0-flash"  # 最新Flash (1M tokens入力, 8K tokens出力)
